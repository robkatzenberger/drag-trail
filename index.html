<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THE DRAG CIRCUIT</title>
<style>
  :root { --bg: #000000; --fg: #33ff33; --dim: #1f7a1f; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--fg);
    font-family: "Courier New", Courier, ui-monospace, monospace;
    font-size: 18px; line-height: 1.35; min-height: 100%;
  }
  body { padding: 12px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  #crt {
    max-width: 42rem; margin: 0 auto; min-height: calc(100vh - 24px);
    border: 2px solid var(--fg); padding: 16px 16px 20px;
    display: flex; flex-direction: column;
  }
  header.hud {
    border-bottom: 1px solid var(--dim); padding-bottom: 8px; margin-bottom: 12px;
    color: var(--dim); font-size: 0.95rem; white-space: pre-wrap;
  }
  header.hud strong { color: var(--fg); font-weight: normal; }
  #art {
    white-space: pre; font-size: 0.85rem; line-height: 1.15;
    color: var(--fg); overflow-x: auto; margin: 0 0 12px;
  }
  #text { white-space: pre-wrap; flex: 1; margin: 0 0 14px; }
  .dim { color: var(--dim); }
  input[type="text"], input[type="number"] {
    background: var(--bg); color: var(--fg); border: 2px solid var(--fg);
    font: inherit; padding: 10px 12px; width: 100%; outline: none;
    border-radius: 0; margin: 8px 0 12px;
  }
  input:focus { background: #000000; }
  .choices { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
  button {
    background: var(--bg); color: var(--fg); border: 2px solid var(--fg);
    font: inherit; text-align: left; padding: 12px 14px; min-height: 48px;
    cursor: pointer; border-radius: 0; width: 100%;
  }
  button:hover, button:focus { background: var(--fg); color: var(--bg); outline: none; }
  button:disabled { border-color: var(--dim); color: var(--dim); cursor: not-allowed; }
  button:disabled:hover { background: var(--bg); color: var(--dim); }
  .row { display: flex; gap: 8px; }
  .row button { flex: 1; }
  .log {
    color: var(--dim); max-height: 8rem; overflow-y: auto; white-space: pre-wrap;
    margin-bottom: 10px; border-top: 1px solid var(--dim); padding-top: 8px;
  }
  #tree-field {
    white-space: pre; font-size: 0.95rem; line-height: 1.15; min-height: 8rem;
    border: 1px solid var(--dim); padding: 8px; margin-bottom: 10px;
  }
</style>
</head>

    const sign = n < 0 ? "-" : "";
    return sign + Math.abs(n).toFixed(3);
  }
  function fmtMPH(n) { return Math.round(n).toString(); }

    const party = [{ name: racer, role: "Racer", health: 5, illness: null, lastIllness: null, daysIll: 0, buried: false }];
    for (let i = 0; i < ROLES.length; i++) {
      party.push({ name: names[i] || DEFAULT_NAMES[i], role: ROLES[i], health: 5, illness: null, lastIllness: null, daysIll: 0, buried: false });
    }
    return party;
  }
  function newRivals() {

  function healthWord(p) {
    if (p.health <= 0 || p.buried) return "out";

    if (p.health === 4) return "fair";
    if (p.health === 3) return "tired";
    return "worn";

  function partyHealth(s) {
    const a = alive(s);
    if (!a.length) return "none";
    const avg = a.reduce((n, p) => n + p.health, 0) / a.length;
    if (avg >= 4.5) return "good";
    if (avg >= 3.5) return "fair";

  function currentTrack() { return TRACKS[S.trackIndex] || TRACKS[TRACKS.length - 1]; }

  function pointsLeader() {
    let best = { name: S.team, points: S.points, isPlayer: true };
    S.rivals.forEach(r => { if (r.points > best.points) best = { name: r.name, points: r.points, isPlayer: false }; });

  function currentBaseET() {
    const c = clsOf();

    et += (100 - S.carHealth) / 100 * 0.40;
    if (S.slicks < 2) et += 0.18;
    if (S.fuel < c.fuelPerRun) et += 0.22;
    const chief = S.party.find(p => p.role === "Crew Chief");
    const tuner = S.party.find(p => p.role === "Tuner");
    if (chief && (chief.health <= 0 || chief.buried || chief.illness)) et += 0.04;
    if (tuner && (tuner.health <= 0 || tuner.buried || tuner.illness)) et += 0.07;

    return et;

  function canRun() {
    const c = clsOf();

    s.party.forEach(p => {
      if (p.health <= 0 && !p.buried) {
        p.health = 0; p.buried = true; p.illness = null;
        const why = reason || p.lastIllness || "the road";
        const epitaph = story("epitaph", { name: p.name, role: p.role, team: s.team, why: why, date: fmtDate(s.date) });
        s.graves.push({ track: currentTrack().name, text: epitaph, name: p.name });
        log(s, story("outLog", { name: p.name, why: why }));
      }
    });
    if (racerOf(s).health <= 0 || racerOf(s).buried) endGame(s, false, "racer");
    else if (livingCount(s) === 0) endGame(s, false, "racer");
  }
  function infect(s, person, illness) {
    if (!person || person.health <= 0 || person.buried) return;
    person.illness = illness.id;
    person.lastIllness = illness.name;
    person.daysIll = 0;
    person.health = clamp(person.health - illness.severity + 1, 1, 5);
    log(s, story("infect", { name: person.name, illness: illness.name }));
  }
  function tickIllness(s) {
    alive(s).forEach(p => {
      if (!p.illness) return;
      p.daysIll++;
      const ill = ILLNESSES.find(i => i.id === p.illness) || ILLNESSES[0];
      if (chance(0.22) && p.daysIll >= 2) {
        log(s, story("recover", { name: p.name, illness: ill.name }));
        p.illness = null; p.daysIll = 0;
        p.health = clamp(p.health + 1, 1, 5);
      } else if (chance(0.08 + ill.severity * 0.03)) {
        p.health = clamp(p.health - 1, 0, 5);
        if (p.health <= 0) checkOuts(s, ill.name);
      }
    });
  }
  function tickDailyHealth(s) {
    const need = livingCount(s) * 2;
    if (s.food >= need) s.food -= need;
    else {
      s.food = 0;
      damageHealth(s, 1, "an empty cooler");
      if (!s.over) log(s, story("outOfFood"));
    }
    if (s.fuel >= 2) s.fuel -= 2;
    else if (s.fuel > 0) s.fuel = 0;
    tickIllness(s);
    checkOuts(s);
    if (s.cash < 0) s.cash = 0;
  }

  function computeScore(s) {
    const c = CLASSES[s.cls];
    const supplies = s.slicks * 15 + s.fuel * 3 + s.parts * 20 + s.trans * 25 + s.chutes * 15 + s.food * 0.2;
    const people = alive(s).reduce((n, p) => n + p.health * 20, 0);
    const raw = s.cash + supplies + people + s.points * 8 + s.carHealth * 2 + s.eventsWon * 80;
    return Math.max(0, Math.round(raw * c.multiplier));
  }
  function loadScores() {
    try { return JSON.parse(localStorage.getItem(SCORES_KEY) || "[]"); } catch (e) { return []; }
  }
  function saveScore(s) {
    const list = loadScores();
    list.push({
      name: s.racer, team: s.team, car: s.car, cls: CLASSES[s.cls].name,
      score: s.score, points: s.points, date: fmtDate(s.date)
    });
    list.sort((a, b) => b.score - a.score);
    localStorage.setItem(SCORES_KEY, JSON.stringify(list.slice(0, 10)));
  }
  function saveGame() {
    if (!S || S.over || !S.started) return;
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
  }
  function loadGame() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      const g = JSON.parse(raw);
      g.date = new Date(g.date);
      if (!g.lastStory) g.lastStory = {};
      if (!g.rivals) g.rivals = newRivals();
      return g;
    } catch (e) { return null; }
  }
  function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

  function endGame(s, win, kind, extraMsg) {
    if (s.over) return;
    s.over = true; s.win = win; s.endKind = kind;
    s.score = computeScore(s);
    const vars = { team: s.team, car: s.car, name: s.racer, pts: s.points };
    let msg;
    if (win) {
      if (kind === "swept" || s.eventsWon >= 4) msg = story("winChampSwept", vars);
      else if (kind === "close") msg = story("winChampClose", vars);
      else msg = story("winChamp", vars);
      saveScore(s);
    } else if (kind === "broke") msg = story("loseBroke", vars);
    else if (kind === "car") msg = story("loseCar", vars);
    else if (kind === "racer") msg = story("loseRacer", vars);
    else if (kind === "points") msg = story("losePoints", vars);
    else msg = story("loseMid", vars);
    if (extraMsg) msg += "\n\n" + extraMsg;
    s.endMessage = msg;
    clearSave();
    showEnd();
  }

  function clearUI() {
    if (keyHandler) { document.removeEventListener("keydown", keyHandler); keyHandler = null; }
    el.extra.innerHTML = "";
    el.choices.innerHTML = "";
    ui.eventOpen = false;
  }
  function setText(t) { el.text.textContent = t; }
  function setArt(a) { el.art.textContent = a || ""; }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }
  function showHud(show) {
    if (!show || !S || !S.started || S.over) { el.hud.hidden = true; el.log.hidden = true; return; }
    el.hud.hidden = false;
    const tr = currentTrack();
    el.hud.innerHTML =
      "<strong>" + escapeHtml(S.team) + "</strong>  |  " + escapeHtml(S.car) + "  |  " + fmtDate(S.date) + "\n" +
      "Cash: " + money(S.cash) + "   Food: " + Math.round(S.food) + "   Fuel: " + S.fuel + "   Slicks: " + S.slicks + "   Car: " + S.carHealth + "%\n" +
      "Record: " + S.seasonW + "-" + S.seasonL + "   Points: " + S.points + "   At: " + tr.short + "   Crew: " + partyHealth(S);
    if (S.log.length) { el.log.hidden = false; el.log.textContent = S.log.slice(0, 4).join("\n"); }
    else el.log.hidden = true;
  }
  function choices(items) {
    el.choices.innerHTML = "";
    const map = {};
    items.forEach((it, i) => {
      const num = it.num || (i + 1);
      map[String(num)] = it;
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = num + ". " + it.label;
      if (it.disabled) b.disabled = true;
      b.addEventListener("click", () => { if (!b.disabled) it.fn(); });
      el.choices.appendChild(b);
    });
    keyHandler = function (e) {
      if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
      const it = map[e.key];
      if (it && !it.disabled) { e.preventDefault(); it.fn(); }
    };
    document.addEventListener("keydown", keyHandler);
  }
  function askText(placeholder, value, onSubmit, buttonLabel) {
    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = placeholder;
    input.value = value || "";
    input.maxLength = 24;
    input.autocomplete = "off";
    input.spellcheck = false;
    el.extra.appendChild(input);
    setTimeout(() => input.focus(), 50);
    const go = () => onSubmit(input.value.trim());
    input.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    choices([{ label: buttonLabel || "Continue", fn: go }]);
  }
  function showEvent(art, text, items) {

    ui.screen = "event";
    clearUI();
    showHud(true);
    setArt(art || "");
    setText(text);
    choices(items);
    saveGame();

    setText("A season on the drag racing circuit, from Texas Motorplex in Ennis to the Big Go in Indianapolis.\nYou are the racer. Name yourself, name the team and the car, and pick a class.\n\nGreen text. Black screen. Numbered choices. Qualifying, eliminations, a Christmas tree, and a lot of highway.");

  function showLearn() {
    clearUI(); showHud(false); setArt(ART.tree);
    setText("THE DRAG CIRCUIT\n\nTravel from track to track in a hauler. Food and hauler fuel get used on the road. Random trouble happens: breakdowns, motels, sponsors, weather.\n\nAt each track you pay an entry, run qualifying, then an 8-car elimination ladder (quarter, semi, final).\n\nEach pass: pick a tune (safe, aggressive, all-in), then leave on the Christmas tree. Tap GO when the lights go green. Early is a red light and a loss. A good light can holeshot a quicker car.\n\nThe slip shows e.t., mph, and reaction time. Parts break. Tires shake. Chutes sometimes fail in a cartoon way. No gore. No real people are roasted.\n\nStreet/Bracket starts with more cash and a lower score multiplier. Pro Mod is the middle. Top Fuel is short money, high multiplier.\n\nWin the championship on points after the Big Go at Indianapolis — or go broke, break the car, or fail to make the finale.\n\nDigits 1-9 choose. Buttons work with a finger. A season can be saved and picked up later.");
    choices([{ label: "Back", fn: showTitle }]);
  }

    clearUI(); showHud(false); setArt(ART.trophy);
    const list = loadScores();
    let t = "CHAMPIONSHIP TOP TEN\n\n";
    if (!list.length) t += "No champions yet. Someone has to win the year first.";
    else list.forEach((r, i) => {
      t += (i + 1) + ". " + r.name + "  —  " + r.team + "  (" + r.car + ")\n   " + r.cls + "   " + r.score + " pts-score   " + r.points + " season pts   " + r.date + "\n";

  function askClass() {

    setText("Pick a class. More cash means a lower score multiplier. Less cash means the year is sharper, and a championship is worth more.");
    choices(Object.keys(CLASSES).map(id => {

  function askCrew(i) {

  function pricesAt(kind) {
    const prices = {};
    STORE_ITEMS.forEach(it => { prices[it.key] = kind === "start" ? it.start : it.track; });
    return prices;
  }
  function openStore(isStart, kind) {
    ui.storeKind = kind || (isStart ? "start" : "track");
    ui.storeBuy = { slicks: 0, fuel: 0, parts: 0, trans: 0, chutes: 0, food: 0 };
    ui.screen = "store";
    if (isStart) S.started = false;
    renderStore();
  }
  function renderStore() {
    clearUI(); showHud(!!S.started); setArt(ART.shop);
    const prices = pricesAt(ui.storeKind);
    const spent = STORE_ITEMS.reduce((n, it) => n + (ui.storeBuy[it.key] || 0) * prices[it.key], 0);
    const left = Math.round((S.cash - spent) * 100) / 100;
    const intro = ui.storeKind === "start" ? story("shopIntroStart") : story("shopIntroTrack");
    let t = intro + "\n\nCash on hand: " + money(S.cash) + "   This bill: " + money(spent) + "   After: " + money(left) + "\n";
    if (S.started) t += "Already in the hauler: slicks " + S.slicks + ", fuel " + S.fuel + ", parts " + S.parts + ", trans " + S.trans + ", chutes " + S.chutes + ", food " + Math.round(S.food) + "\n";
    t += "\nFuel here is " + clsOf().fuelName + ".";
    setText(t);
    const items = STORE_ITEMS.map(it => {
      const n = ui.storeBuy[it.key] || 0;
      return { label: it.name + "  (" + money(prices[it.key]) + " / " + it.unit + ")   x" + n, fn: () => {
        const unit = it.key === "food" ? 50 : 1;
        const next = n + unit;
        const would = spent - n * prices[it.key] + next * prices[it.key];
        if (would <= S.cash + 0.001) ui.storeBuy[it.key] = next;
        renderStore();
      } };
    });
    items.push({ label: "Remove last add from one item (cycle)", fn: () => {
      for (let i = STORE_ITEMS.length - 1; i >= 0; i--) {
        const k = STORE_ITEMS[i].key;
        const step = k === "food" ? 50 : 1;
        if ((ui.storeBuy[k] || 0) >= step) { ui.storeBuy[k] -= step; break; }
      }
      renderStore();
    }});
    if (ui.storeKind === "start") items.push({ label: "Pay the bill and go to the Motorplex", disabled: left < 0, fn: () => checkoutStore(prices, spent, true) });
    else {
      items.push({ label: "Pay the bill", disabled: left < 0 || spent <= 0, fn: () => checkoutStore(prices, spent, false) });
      items.push({ label: "Leave the shop", fn: showPits });
    }
    choices(items);
  }
  function checkoutStore(prices, spent, depart) {
    S.cash = Math.round((S.cash - spent) * 100) / 100;
    STORE_ITEMS.forEach(it => { S[it.key] += (ui.storeBuy[it.key] || 0); });
    if (depart) {
      S.started = true;
      log(S, "The season opens at Texas Motorplex, Ennis.");
      arriveTrack(true);
    } else {
      log(S, "You bought supplies at the track shop.");
      showPits();
    }
  }

      "Date: " + fmtDate(S.date) + "\n" +

      (S.graves.length ? "Out: " + S.graves.map(g => g.name).join(", ") + "\n" : "") +

  function showSupplies() {

    ).sort((a, b) => b.points - a.points || b.wins - a.wins);

    clearUI(); showHud(true); setArt(ART.track);
    let t = "THE CIRCUIT\n\n";
    TRACKS.forEach((tr, i) => {
      const mark = i < S.trackIndex ? "done" : i === S.trackIndex ? "YOU" : "    ";
      t += (i + 1) + ". [" + mark + "] " + tr.name + "   (" + tr.mile + " mi)  fee " + money(tr.fee) + (tr.kind === "finale" ? "   FINALE" : "") + "\n";

  function talkCrew() {
    clearUI(); showHud(true); setArt(ART.pits);
    const lines = alive(S).map(p => {
      const v = { name: p.name, illness: p.illness ? (ILLNESSES.find(i => i.id === p.illness) || { name: "something" }).name : "", role: p.role };
      if (p.illness) return story("talkIll", v);
      if (p.health <= 2) return story("talkWorn", v);
      if (S.food < livingCount(S) * 8) return story("talkHungry", v);
      if (p.role === "Racer") return story("talkRacer", v);
      if (p.role === "Crew Chief") return story("talkChief", v);
      if (p.role === "Tuner") return story("talkTuner", v);
      return story("talkMech", v);
    });
    setText(lines.join("\n\n"));
    choices([{ label: "Back", fn: showPits }]);
  }
  function restDays(n) {
    ui.eventOpen = false;
    for (let i = 0; i < n; i++) {
      if (S.over) return;
      S.date = addDays(S.date, 1);
      setWeather(S);
      tickDailyHealth(S);
      if (S.over) return;
      alive(S).forEach(p => { if (chance(0.45)) p.health = clamp(p.health + 1, 0, 5); });
      if (S.carHealth < 100 && chance(0.4)) S.carHealth = clamp(S.carHealth + 2, 0, 100);
      if (maybeRoadEvent(0.08) || ui.eventOpen) return;
    }
    if (!S.over && !ui.eventOpen) {
      log(S, story("restDays", { days: plural(n, "day") }));
      const done = ui.restDone || showPits;
      ui.restDone = null;
      done();
    }
  }


  function showPits() {
    if (S.over) return showEnd();
    ui.screen = "pits";
    ui.resume = showPits;
    clearUI(); showHud(true);
    const tr = currentTrack();
    setArt(S.eventOver ? ART.hauler : ART.pits);

    else if (S.entered && !S.eventOver) {
      t += "\nYou are in. Qualifying: " + (S.qualsLeft > 0 ? S.qualsLeft + " pass(es) left" : "complete") + (S.bestQual != null ? ", best " + fmtET(S.bestQual.et) + " at " + fmtMPH(S.bestQual.mph) + " mph" : ", no time") + ".";
      if (S.qualsLeft <= 0 && S.round === 0) t += " Eliminations can start.";
      if (S.round > 0) t += " You are in eliminations (round " + S.round + "). Record this event: " + S.eventW + "-" + S.eventL + ".";
    } else t += "\nThis event is over for you. Record: " + S.eventW + "-" + S.eventL + ".";
    setText(t);
    const items = [];
    if (!S.entered && !S.eventOver) items.push({ label: "Enter the event (" + money(tr.fee) + ")", fn: payEntry });
    if (S.entered && !S.eventOver && S.qualsLeft > 0) items.push({ label: "Make a qualifying pass", fn: startQual });
    if (S.entered && !S.eventOver && S.round === 0 && (S.qualsLeft <= 0 || (!canRun() && S.bestQual))) items.push({ label: "Start eliminations", fn: startElims });
    if (S.entered && !S.eventOver && S.round === 0 && !canRun() && S.qualsLeft > 0 && !S.bestQual) items.push({ label: "Scratch this event (cannot run)", fn: scratchEvent });

  function arriveTrack(isStart) {
    S.entered = false;
    S.eventOver = false;
    S.eventW = 0; S.eventL = 0;
    S.qualsLeft = 0; S.bestQual = null; S.qualRuns = [];

    setWeather(S);
    const tr = currentTrack();
    const pool = "arr:" + tr.name;
    const blurb = (STORIES[pool] ? story(pool, { name: (alive(S)[0] || { name: S.racer }).name }) : tr.note);
    showEvent(ART.track, "You have arrived at " + tr.name + ".\n\n" + blurb, [

  function payEntry() {
    const tr = currentTrack();
    if (S.cash < tr.fee) {
      showEvent("", story("cantAfford", { n: money(tr.fee) }), [
        { label: "Scratch this event and travel on", fn: scratchEvent },
        { label: "Back to the pits", fn: showPits }
      ]);
      return;
    }
    S.cash = Math.round((S.cash - tr.fee) * 100) / 100;
    S.entered = true;
    S.qualsLeft = 2;
    S.round = 0;
    log(S, "Entered " + tr.name + " for " + money(tr.fee) + ".");
    const item = chance(0.25) ? pick(["bolt", "trans blanket strap", "chute pin", "number plate", "throttle clip"]) : null;
    const msg = story("entryPaid", { n: money(tr.fee) }) + "\n\n" + (item ? story("techIssue", { item: item, name: S.racer }) : story("techPass", { name: S.racer }));
    showEvent(ART.pits, msg, [{ label: "Continue", fn: showPits }]);
  }
  function scratchEvent() {
    S.eventOver = true;
    S.entered = false;
    log(S, "Scratched " + currentTrack().short + " — could not pay the entry.");
    simulateFieldPoints(false, 0);
    if (!nextTrack() ) { finishSeason(); return; }
    showPits();
  }

  function hitTheRoad() {
    const nxt = nextTrack();
    if (!nxt) return finishSeason();
    ui.resume = continueTravel;
    ui.travelDaysLeft = Math.max(1, nxt.daysFromPrev);
    log(S, "The hauler rolls toward " + nxt.name + ".");
    continueTravel();
  }
  function continueTravel() {
    if (S.over) return;
    ui.resume = continueTravel;
    while (ui.travelDaysLeft > 0) {
      ui.travelDaysLeft--;
      S.date = addDays(S.date, 1);
      setWeather(S);
      tickDailyHealth(S);
      if (S.over) return;
      if (S.fuel <= 0 && chance(0.5)) {
        showEvent(ART.hauler, story("outOfFuel", { fuel: clsOf().fuelName, name: (alive(S)[0] || { name: S.racer }).name }), [
          { label: "Scrounge 4 cans for " + money(20), fn: () => {
            if (S.cash >= 20) { S.cash -= 20; S.fuel += 4; }
            else { S.fuel += 2; S.cash = Math.max(0, S.cash); }
            afterEvt();
          }}
        ]);
        return;
      }
      if (maybeRoadEvent(0.30)) return;
    }
    S.trackIndex++;
    arriveTrack(false);
  }
  function afterEvt() {
    if (S.over) return;
    const fn = ui.resume || showPits;
    fn();
  }

  function maybeRoadEvent(p) {
    if (S.over) return false;
    if (!chance(p)) return false;
    const evs = roadEvents();
    if (!evs.length) return false;
    evs[rand(evs.length)]();
    return true;
  }
  function someone() { return pick(alive(S)); }
  function roadEvents() {
    const evs = [];
    const add = (fn, w) => { for (let i = 0; i < (w || 1); i++) evs.push(fn); };

    add(() => {
      const part = pick(["belt", "alternator", "trailer jack", "hub bearing", "coolant hose"]);
      if (S.parts > 0 && chance(0.55)) {
        S.parts--;
        S.date = addDays(S.date, 1); tickDailyHealth(S);
        if (S.over) return;
        log(S, "The hauler needed a spare.");
        showEvent(ART.hauler, story("haulerSpare", { part: part, name: (someone() || { name: S.racer }).name }), [{ label: "Continue", fn: afterEvt }]);
      } else {
        for (let i = 0; i < 3; i++) { if (S.over) return; S.date = addDays(S.date, 1); setWeather(S); tickDailyHealth(S); }
        if (S.over) return;
        log(S, "You improvised a hauler repair.");
        showEvent(ART.hauler, story("haulerNoSpare", { part: part }), [{ label: "Continue", fn: afterEvt }]);
      }
    }, 3);

    add(() => {
      const n = Math.min(S.cash, 15 + rand(30));
      if (n < 10) { afterEvt(); return; }
      S.cash -= n;
      alive(S).forEach(p => { if (chance(0.5)) p.health = clamp(p.health + 1, 0, 5); });
      log(S, "A motel night cost " + money(n) + ".");
      showEvent(ART.motel, story("motelNight", { n: money(n), name: (someone() || { name: S.racer }).name }), [{ label: "Continue", fn: afterEvt }]);
    }, 3);

    add(() => {
      const n = 40 + rand(80);
      S.cash += n;
      log(S, "A sponsor sent " + money(n) + ".");
      showEvent("", story("sponsorGood", { n: money(n) }), [{ label: "Continue", fn: afterEvt }]);
    }, 2);

    add(() => {
      const n = Math.min(S.cash, 20 + rand(50));
      if (n < 8) { afterEvt(); return; }
      S.cash = Math.round((S.cash - n) * 100) / 100;
      log(S, "A bad sponsor call cost " + money(n) + ".");
      showEvent("", story("sponsorBad", { n: money(n) }), [{ label: "Continue", fn: afterEvt }]);
    }, 2);

    add(() => {
      const days = 1 + rand(2);
      for (let i = 0; i < days; i++) { S.date = addDays(S.date, 1); S.weather = "rain"; tickDailyHealth(S); if (S.over) return; }
      log(S, "Rain delayed the hauler " + plural(days, "day") + ".");
      showEvent(ART.hauler, story("rainDelay", { days: plural(days, "day") }), [{ label: "Continue", fn: afterEvt }]);
    }, 2);

    add(() => {
      const n = 20 + rand(40);
      const cost = Math.min(S.cash, Math.round(n * 0.5));
      S.cash -= cost; S.food += n;
      log(S, "You restocked " + n + " meals.");
      showEvent(ART.motel, story("foodStop", { n: n, name: (someone() || { name: S.racer }).name }), [{ label: "Continue", fn: afterEvt }]);
    }, 2);

    add(() => {
      S.date = addDays(S.date, 1); tickDailyHealth(S);
      if (S.over) return;
      log(S, "The hauler threw a flat.");
      showEvent(ART.hauler, story("flatHauler", { name: (someone() || { name: S.racer }).name }), [{ label: "Continue", fn: afterEvt }]);
    }, 2);

    add(() => {
      log(S, "A radio interview.");
      showEvent("", story("radioInterview", { name: (someone() || { name: S.racer }).name }), [{ label: "Continue", fn: afterEvt }]);
    }, 2);

    add(() => {
      const days = 1 + rand(2);
      for (let i = 0; i < days; i++) { S.date = addDays(S.date, 1); tickDailyHealth(S); if (S.over) return; }
      log(S, "A wrong exit cost " + plural(days, "day") + ".");
      showEvent(ART.hauler, story("wrongExit", { days: plural(days, "day") }), [{ label: "Continue", fn: afterEvt }]);
    }, 2);

    add(() => {
      const item = pick(["slicks", "parts", "chutes", "trans"]);
      const addn = item === "slicks" ? 2 : 1;
      S[item] += addn;
      log(S, "You picked up a spare " + item + ".");
      showEvent(ART.shop, story("partsFind", { item: item === "slicks" ? "couple of slicks" : item === "trans" ? "spare trans" : item === "chutes" ? "parachute pack" : "crate of engine parts" }), [{ label: "Continue", fn: afterEvt }]);
    }, 2);

    add(() => {
      S.date = addDays(S.date, 1); tickDailyHealth(S);
      if (S.over) return;
      log(S, "A weigh station delayed you.");
      showEvent(ART.hauler, story("weighStation"), [{ label: "Continue", fn: afterEvt }]);
    }, 1);

    add(() => {
      const rival = pick(S.rivals).name;
      log(S, "You crossed paths with " + rival + ".");
      showEvent(ART.hauler, story("rivalConvoy", { rival: rival }), [{ label: "Continue", fn: afterEvt }]);
    }, 2);

    add(() => {
      alive(S).forEach(p => { if (chance(0.4)) p.health = clamp(p.health + 1, 0, 5); });
      showEvent("", story("fanPhoto", { name: (someone() || { name: S.racer }).name }), [{ label: "Continue", fn: afterEvt }]);
    }, 2);

    add(() => {
      if (S.parts > 0 && chance(0.5)) S.parts--;
      else if (S.slicks > 0) S.slicks = Math.max(0, S.slicks - 1);
      log(S, "Tools or a small part walked off in the night.");
      showEvent(ART.motel, story("toolTheft", { name: (someone() || { name: S.racer }).name }), [{ label: "Continue", fn: afterEvt }]);
    }, 2);

    add(() => {
      if (S.weather !== "hot") S.weather = "hot";
      const p = someone();
      if (p && !p.illness && chance(0.5)) infect(S, p, ILLNESSES.find(i => i.id === "heat") || ILLNESSES[0]);
      if (p && !p.illness && p.health > 1 && chance(0.4)) p.health = clamp(p.health - 1, 1, 5);
      log(S, "A heat wave rolled over the hauler.");
      showEvent(ART.hauler, story("heatWave", { name: (someone() || { name: S.racer }).name }), [{ label: "Continue", fn: afterEvt }]);
    }, 2);

    add(() => {
      log(S, "Fair weather, clean miles.");
      showEvent(ART.hauler, story("goodWeather"), [{ label: "Continue", fn: afterEvt }]);
    }, 2);

    add(() => {
      const n = 25 + rand(60);
      S.cash += n;
      log(S, "A surprise check for " + money(n) + ".");
      showEvent("", story("paycheck", { n: money(n), name: (someone() || { name: S.racer }).name }), [{ label: "Continue", fn: afterEvt }]);
    }, 1);

    add(() => {
      const p = someone();
      if (!p) { afterEvt(); return; }
      infect(S, p, pick(ILLNESSES));
      showEvent("", story("infect", { name: p.name, illness: (ILLNESSES.find(i => i.id === p.illness) || { name: "a slump" }).name }), [
        { label: "Keep rolling", fn: afterEvt },
        { label: "Stop and rest 2 days", fn: () => { ui.restDone = afterEvt; restDays(2); } }
      ]);
    }, 3);

    add(() => {
      const others = alive(S).filter(x => x.role !== "Racer");
      if (!others.length) { afterEvt(); return; }
      const p = pick(others);
      showEvent("", story("crewQuitEvent", { name: p.name }), [
        { label: "Talk them into staying", fn: () => {
          if (chance(0.7)) {
            log(S, p.name + " stayed on the crew.");
            showEvent("", story("crewStay", { name: p.name, role: p.role }), [{ label: "Continue", fn: afterEvt }]);
          } else {
            p.health = 0; p.buried = true;
            S.graves.push({ track: (currentTrack() || {}).name, name: p.name, text: p.name + " left " + S.team + " on the road, " + fmtDate(S.date) + "." });
            log(S, p.name + " left the team.");
            showEvent("", story("quit", { name: p.name }), [{ label: "Continue", fn: afterEvt }]);
          }
        }},
        { label: "Wish them well and let them go", fn: () => {
          p.health = 0; p.buried = true;
          S.graves.push({ track: (currentTrack() || {}).name, name: p.name, text: p.name + " left " + S.team + " on the road, " + fmtDate(S.date) + "." });
          log(S, p.name + " left the team.");
          showEvent("", story("quit", { name: p.name }), [{ label: "Continue", fn: afterEvt }]);
        }}
      ]);
    }, 2);

    return evs;
  }


  function consumeRun() {
    const c = clsOf();
    S.fuel = Math.max(0, S.fuel - c.fuelPerRun);
    const slickUse = c.slickPerRun;
    if (slickUse >= 1) S.slicks = Math.max(0, S.slicks - 1);
    else if (chance(slickUse)) S.slicks = Math.max(0, S.slicks - 1);
    if (S.carHealth > 0 && chance(0.15)) S.carHealth = clamp(S.carHealth - 1, 0, 100);
  }

  function makeOpponent(name) {
    const base = currentBaseET();
    const et = Math.max(cMinET(), base + (Math.random() * 0.24 - 0.07));
    const rt = 0.035 + Math.random() * 0.150;
    return { name: name || pick(S.rivals).name, et: +et.toFixed(3), rt: +rt.toFixed(3), mph: Math.round(etToMph(et, S.cls)) };
  }
  function cMinET() { return clsOf().baseET * 0.88; }

  function buildField() {
    const used = {};
    const names = [];
    const pool = S.rivals.slice().sort(() => Math.random() - 0.5);
    for (let i = 0; i < 7; i++) {
      const n = (pool[i] || pick(S.rivals)).name;
      if (!used[n]) { used[n] = true; names.push(n); }
      else names.push(pick(RIVAL_NAMES.filter(x => !used[x])) || ("Racer " + (i + 2)));
    }
    return names.map(n => {
      const o = makeOpponent(n);
      o.qual = o.et + (Math.random() * 0.08 - 0.02);
      return o;
    });
  }

  function startQual() {
    if (!canRun()) {
      const need = S.fuel < clsOf().fuelPerRun ? clsOf().fuelName : "slicks";
      showEvent("", story("cantRaceSupplies", { need: need }), [
        { label: "Forfeit this pass", fn: () => { S.qualsLeft = Math.max(0, S.qualsLeft - 1); showPits(); } },
        { label: "Skip remaining qualifying", fn: () => { S.qualsLeft = 0; showPits(); } },
        { label: "Back to the pits", fn: showPits }
      ]);
      return;
    }
    S._raceMode = "qual";
    S.opponent = null;
    pickTune();
  }

  function startElims() {
    if (S.bestQual == null) {
      S.eventOver = true;
      log(S, "DNQ at " + currentTrack().short + ".");
      simulateFieldPoints(false, 0);
      showEvent(ART.track, story("dnq", { track: currentTrack().name, name: S.racer, team: S.team }), [{ label: "Back to the pits", fn: showPits }]);
      return;
    }
    const others = buildField();
    const field = others.concat([{ name: S.racer, et: S.bestQual.et, qual: S.bestQual.et, mph: S.bestQual.mph, isPlayer: true }]);
    field.sort((a, b) => a.qual - b.qual);
    const seed = field.findIndex(x => x.isPlayer) + 1;
    if (seed < 1 || seed > 8) {
      S.eventOver = true;
      log(S, "DNQ at " + currentTrack().short + ".");
      simulateFieldPoints(false, 0);
      showEvent(ART.track, story("dnq", { track: currentTrack().name, team: S.team }), [{ label: "Back to the pits", fn: showPits }]);
      return;
    }
    S.seed = seed;
    S.field = field;
    S.round = 1;
    S.points += 10;
    log(S, "Qualified " + seed + " at " + currentTrack().short + " with " + fmtET(S.bestQual.et) + ".");
    pairElim();
  }

  function pairElim() {
    // opponent from remaining field, roughly by seed
    const oppPool = S.field.filter(x => !x.isPlayer && !x.out);
    if (!oppPool.length) {
      // won the event without a last pairing? treat as event win
      winEvent();
      return;
    }
    // seed vs (9-seed) style if possible
    const want = 9 - S.seed;
    let opp = oppPool.find((x, i, arr) => {
      const rank = S.field.filter(f => !f.out).sort((a, b) => a.qual - b.qual).indexOf(x) + 1;
      return rank === want;
    }) || pick(oppPool);
    S.opponent = makeOpponent(opp.name);
    S.opponent._ref = opp;
    showEvent(ART.tree, story("elimIntro", { seed: S.seed, rival: S.opponent.name, name: (someone() || { name: S.racer }).name }), [
      { label: "Choose a tune", fn: pickTune }
    ]);
  }

  function pickTune() {
    if (!canRun()) {
      const need = S.fuel < clsOf().fuelPerRun ? clsOf().fuelName : "slicks";
      showEvent("", story("cantRaceSupplies", { need: need }), [
        { label: "Forfeit the pass", fn: () => {
          if (S._raceMode === "qual" || !S.opponent) {
            S.qualsLeft = Math.max(0, S.qualsLeft - 1);
            showPits();
          } else loseRound("forfeit");
        }},
        { label: "Back to the pits", fn: showPits }
      ]);
      return;
    }
    const rival = S.opponent ? S.opponent.name : "the clock";
    clearUI(); showHud(true); setArt(ART.tree);
    setText(story("tuneAsk", { rival: rival }));
    choices([
      { label: TUNES.safe.label, fn: () => startTree("safe") },
      { label: TUNES.aggressive.label, fn: () => startTree("aggressive") },
      { label: TUNES.allin.label, fn: () => startTree("allin") }
    ]);
  }

  function treeArt(state) {
    // state: { pre, stg, a1, a2, a3, green, red }
    const on = (v, yes, no) => (v ? yes : no);
    return (
      "        CHRISTMAS TREE\n" +
      "         " + on(state.pre, "o   o", ".   .") + "  PRE\n" +
      "         " + on(state.stg, "o   o", ".   .") + "  STG\n" +
      "         " + on(state.a1, "*   *", ".   .") + "\n" +
      "         " + on(state.a2, "*   *", ".   .") + "\n" +
      "         " + on(state.a3, "*   *", ".   .") + "\n" +
      "         " + on(state.green, "G   G", ".   .") + "  GREEN\n" +
      "         " + on(state.red, "X   X", ".   .") + "  RED\n"
    );
  }

  function startTree(tuneId) {
    S._tune = tuneId;
    const pro = clsOf().tree === "pro";
    if (typeof window !== "undefined" && window.__dragTest) {
      const red = Math.random() < 0.07;
      const rt = red ? -(0.004 + Math.random() * 0.03) : (0.018 + Math.random() * 0.110);
      finishTree(Math.round(rt * 1000) / 1000);
      return;
    }
    clearUI(); showHud(true);
    setText((pro ? story("treePro") : story("treeSportsman")) + "\n\nStage the car, then TAP GO when the tree goes green. Early is a red light.");
    setArt(treeArt({ pre: true, stg: false, a1: false, a2: false, a3: false, green: false, red: false }));
    ui.tree = { running: false, greenAt: 0, done: false, timers: [] };
    const field = document.createElement("div");
    field.id = "tree-field";
    el.extra.appendChild(field);
    field.textContent = treeArt({ pre: true, stg: false });
    choices([{ label: "Stage, then watch the tree", fn: () => runTreeSequence(pro, field) }]);
  }

  function runTreeSequence(pro, field) {
    if (ui.tree && ui.tree.running) return;
    ui.tree.running = true;
    const paint = (st) => {
      const art = treeArt(st);
      setArt(art);
      if (field) field.textContent = art;
    };
    paint({ pre: true, stg: true });
    const t0 = (typeof performance !== "undefined" ? performance.now() : Date.now());
    const delays = pro
      ? [{ t: 400, st: { pre: 1, stg: 1, a1: 1, a2: 1, a3: 1 } }, { t: 800, st: { pre: 1, stg: 1, a1: 1, a2: 1, a3: 1, green: 1 }, green: true }]
      : [
          { t: 400, st: { pre: 1, stg: 1, a1: 1 } },
          { t: 900, st: { pre: 1, stg: 1, a1: 1, a2: 1 } },
          { t: 1400, st: { pre: 1, stg: 1, a1: 1, a2: 1, a3: 1 } },
          { t: 1900, st: { pre: 1, stg: 1, a1: 1, a2: 1, a3: 1, green: 1 }, green: true }
        ];
    // jitter the green a little so you cannot count perfectly
    const jitter = rand(120);
    delays.forEach(d => {
      const id = setTimeout(() => {
        if (!ui.tree || ui.tree.done) return;
        paint(d.st);
        if (d.green) ui.tree.greenAt = (typeof performance !== "undefined" ? performance.now() : Date.now());
      }, d.t + (d.green ? jitter : 0));
      ui.tree.timers.push(id);
    });
    const go = () => {
      if (!ui.tree || ui.tree.done) return;
      const now = (typeof performance !== "undefined" ? performance.now() : Date.now());
      if (!ui.tree.greenAt) {
        ui.tree.done = true;
        ui.tree.timers.forEach(clearTimeout);
        paint({ pre: 1, stg: 1, red: 1 });
        finishTree(-0.120);
        return;
      }
      const rt = (now - ui.tree.greenAt) / 1000;
      ui.tree.done = true;
      ui.tree.timers.forEach(clearTimeout);
      if (rt < 0) paint({ pre: 1, stg: 1, red: 1 });
      else paint({ pre: 1, stg: 1, a1: 1, a2: 1, a3: 1, green: 1 });
      finishTree(Math.round(rt * 1000) / 1000);
    };
    el.choices.innerHTML = "";
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = "1. GO";
    b.addEventListener("click", go);
    el.choices.appendChild(b);
    if (keyHandler) document.removeEventListener("keydown", keyHandler);
    keyHandler = function (e) {
      if (e.target && e.target.tagName === "INPUT") return;
      if (e.key === "1" || e.key === " " || e.key === "Enter" || e.key === "g" || e.key === "G") { e.preventDefault(); go(); }
    };
    document.addEventListener("keydown", keyHandler);
  }

  function finishTree(rt) {
    if (ui.tree && ui.tree.timers) ui.tree.timers.forEach(clearTimeout);
    ui.tree = null;
    resolveRace(S._tune || "aggressive", rt);
  }

  function resolveRace(tuneId, rt) {
    const tune = TUNES[tuneId] || TUNES.aggressive;
    const isQual = S._raceMode === "qual" || !S.opponent;
    const opp = isQual ? null : S.opponent;
    consumeRun();

    const result = {
      rt: rt, tune: tuneId, isQual: isQual, rival: opp ? opp.name : "Qualifying",
      event: "clean", win: false, dq: false, red: false, et: null, mph: null,
      oet: opp ? opp.et : null, omph: opp ? opp.mph : null, ort: opp ? opp.rt : null,
      margin: null, part: null, text: ""
    };

    if (rt < 0) {
      result.red = true;
      result.event = "redlight";
      result.win = false;
      result.dq = !isQual;
      applyRaceResult(result);
      return;
    }

    // opponent red, sometimes
    if (opp && chance(0.06)) {
      result.event = "oppRed";
      result.win = true;
      result.ort = -(0.005 + Math.random() * 0.04);
      result.ort = +result.ort.toFixed(3);
      let et = currentBaseET() + tune.etAdj + (Math.random() * 0.06 - 0.02);
      result.et = +Math.max(cMinET(), et).toFixed(3);
      result.mph = Math.round(etToMph(result.et, S.cls));
      applyRaceResult(result);
      return;
    }

    // breakage / incidents
    const risk = 0.08 * tune.risk + (S.carHealth < 40 ? 0.08 : 0) + (tuneId === "allin" ? 0.06 : 0);
    const roll = Math.random();
    let et = currentBaseET() + tune.etAdj + (Math.random() * 0.07 - 0.03);

    if (roll < risk * 0.18) {
      result.event = "engineBlow";
      result.dq = true;
      result.win = false;
      S.carHealth = clamp(S.carHealth - (35 + rand(50)), 0, 100);
      applyRaceResult(result);
      return;
    }
    if (!isQual && roll < risk * 0.32) {
      result.event = "centerline";
      result.dq = true;
      result.win = false;
      result.et = +Math.max(cMinET(), et + 0.05).toFixed(3);
      result.mph = Math.round(etToMph(result.et, S.cls));
      applyRaceResult(result);
      return;
    }
    if (roll < risk * 0.50) {
      result.event = "smokedTires";
      et += 0.35 + Math.random() * 0.40;
    } else if (roll < risk * 0.70) {
      result.event = "tireShake";
      et += 0.12 + Math.random() * 0.28;
      S.carHealth = clamp(S.carHealth - 3, 0, 100);
    } else if (roll < risk * 0.88) {
      result.event = "brokenPart";
      result.part = pick(["transmission", "rear end", "header", "blower belt", "axle", "clutch"]);
      et += 0.10 + Math.random() * 0.20;
      S.carHealth = clamp(S.carHealth - (8 + rand(12)), 0, 100);
      const key = result.part === "transmission" ? "trans" : "parts";
      if (S[key] > 0) {
        S[key]--;
        log(S, story("repairUsedPart", { part: result.part, name: (someone() || { name: S.racer }).name }));
      }
    }

    result.et = +Math.max(cMinET(), et).toFixed(3);
    result.mph = Math.round(etToMph(result.et, S.cls));

    if (!isQual && S.chutes > 0 && chance(0.06 + (tune.risk > 1.5 ? 0.04 : 0))) {
      result.event = result.event === "clean" ? "chuteFail" : result.event;
      result._chute = true;
      S.carHealth = clamp(S.carHealth - 6, 0, 100);
      if (S.chutes > 0 && chance(0.7)) S.chutes--;
    }

    if (opp && !result.dq) {
      const pkg = result.et + rt;
      const opkg = opp.et + opp.rt;
      result.margin = Math.abs(pkg - opkg);
      result.margin = +result.margin.toFixed(3);
      result.win = pkg < opkg;
      if (result.win && result.et > opp.et + 0.01 && rt + 0.02 < opp.rt) result.event = result.event === "clean" || result._chute ? (result._chute ? "chuteFail" : "holeshotWin") : result.event;
      if (!result.win && result.et + 0.01 < opp.et && rt > opp.rt + 0.02) result.event = "holeshotLoss";
      if (result.win && result.event === "clean") result.event = "raceWinClean";
      if (!result.win && result.event === "clean") result.event = "raceLossClean";
    } else if (isQual) {
      result.win = true;
    }

    applyRaceResult(result);
  }

  function raceVars(r) {
    return {
      et: r.et != null ? fmtET(r.et) : "—",
      mph: r.mph != null ? fmtMPH(r.mph) : "—",
      rt: fmtRT(r.rt),
      oet: r.oet != null ? fmtET(r.oet) : "—",
      omph: r.omph != null ? fmtMPH(r.omph) : "—",
      ort: r.ort != null ? fmtRT(r.ort) : "—",
      margin: r.margin != null ? fmtET(r.margin) : "—",
      rival: r.rival,
      part: r.part || "part",
      name: S.racer,
      track: currentTrack().name
    };
  }

  function slipText(r) {
    let t = "TIMING SLIP  —  " + currentTrack().short + "\n";
    t += (r.isQual ? "QUALIFYING" : ("vs " + r.rival)) + "   Tune: " + (TUNES[r.tune] || TUNES.aggressive).name + "\n";
    t += "You   RT " + fmtRT(r.rt);
    if (r.et != null) t += "   ET " + fmtET(r.et) + "   " + fmtMPH(r.mph) + " mph";
    else t += "   ET —   no time";
    t += "\n";
    if (!r.isQual) {
      t += r.rival + "   RT " + (r.ort != null ? fmtRT(r.ort) : "—");
      if (r.oet != null) t += "   ET " + fmtET(r.oet) + "   " + (r.omph != null ? fmtMPH(r.omph) : "—") + " mph";
      t += "\n";
      if (r.margin != null && !r.red && !r.dq) t += "Margin: " + fmtET(r.margin) + "\n";
    }
    if (r.red) t += "FOUL START (red light).\n";
    if (r.event === "centerline") t += "DISQUALIFIED (centerline).\n";
    if (r.event === "engineBlow") t += "DID NOT FINISH (engine).\n";
    if (r.event === "oppRed") t += "Opponent foul start.\n";
    return t;
  }

  function applyRaceResult(r) {
    S.lastRace = r;
    S._raceMode = null;
    if (r.et != null && (S.bestET == null || r.et < S.bestET)) S.bestET = r.et;

    if (r.isQual) {
      S.qualsLeft = Math.max(0, S.qualsLeft - 1);
      if (!r.red && !r.dq && r.et != null) {
        S.qualRuns.push(r);
        if (S.bestQual == null || r.et < S.bestQual.et) S.bestQual = { et: r.et, mph: r.mph, rt: r.rt };
      }
      let body;
      if (r.red) body = story("qualifyRed", raceVars(r));
      else if (r.event === "engineBlow") body = story("engineBlow", raceVars(r));
      else if (r.event === "brokenPart") body = story("brokenPart", raceVars(r));
      else if (r.event === "smokedTires") body = story("smokedTires", raceVars(r));
      else if (r.event === "tireShake") body = story("tireShake", raceVars(r));
      else if (r.event === "qualifyBroke" || r.dq) body = story("qualifyBroke", raceVars(r));
      else if (S.bestQual && r.et != null && r.et <= S.bestQual.et + 0.0001) body = story("qualifyGood", raceVars(r));
      else body = story("qualifyBad", raceVars(r));
      log(S, r.red ? "Red-light qualifying pass." : (r.et != null ? ("Qualifying pass: " + fmtET(r.et) + " at " + fmtMPH(r.mph) + " mph.") : "A qualifying pass ended early."));
      const art = r.event === "engineBlow" ? ART.smoke : ART.track;
      showEvent(art, slipText(r) + "\n" + body, [{ label: "Continue", fn: () => afterQualOrBreak(r) }]);
      return;
    }

    // eliminations
    const pool = r.event;
    const body = story(STORIES[pool] ? pool : (r.win ? "raceWinClean" : "raceLossClean"), raceVars(r));
    log(S, (r.win ? "Win" : "Loss") + " vs " + r.rival + (r.et != null ? (" — " + fmtET(r.et) + " / " + fmtRT(r.rt)) : " — no time") + ".");
    const art = r.event === "engineBlow" ? ART.smoke : ART.track;
    showEvent(art, slipText(r) + "\n" + body, [{ label: "Continue", fn: () => afterElim(r) }]);
  }

  function afterQualOrBreak(r) {
    if (r.event === "engineBlow" && S.carHealth <= 0) {
      endGame(S, false, "car");
      return;
    }
    if (r.event === "engineBlow" && S.carHealth < 25 && S.parts < 1) {
      // maybe salvage
      if (S.parts > 0) { S.parts--; S.carHealth = clamp(S.carHealth + 20, 0, 80); }
    }
    if (S.carHealth <= 0) { endGame(S, false, "car"); return; }
    showPits();
  }

  function afterElim(r) {
    if (r.event === "engineBlow" && S.carHealth <= 0) { endGame(S, false, "car"); return; }
    if (S.carHealth <= 0) { endGame(S, false, "car"); return; }
    if (r.win) winRound();
    else loseRound(r.event);
  }

  function winRound() {
    S.eventW++;
    S.seasonW++;
    if (S.opponent && S.opponent._ref) S.opponent._ref.out = true;
    const pts = S.round === 1 ? 20 : S.round === 2 ? 30 : 50;
    S.points += pts;
    if (S.round >= 3) {
      winEvent();
      return;
    }
    S.round++;
    S.opponent = null;
    // advance: remaining field shrinks; pick next opponent
    pairElim();
  }
  function loseRound(why) {
    S.eventL++;
    S.seasonL++;
    S.eventOver = true;
    S.opponent = null;
    simulateFieldPoints(false, S.eventW);
    const tr = currentTrack();
    let msg, purse = 0;
    if (S.round >= 3) {
      purse = Math.round(tr.purse * 0.4);
      S.cash += purse;
      msg = story("eventRunner", { track: tr.name, purse: money(purse), team: S.team });
      log(S, "Runner-up at " + tr.short + " for " + money(purse) + ".");
    } else {
      msg = story("eventOut", { track: tr.name, team: S.team });
      log(S, "Out at " + tr.short + " in round " + S.round + ".");
    }
    showEvent(ART.pits, msg, [{ label: "Back to the pits", fn: showPits }]);
  }
  function winEvent() {
    const tr = currentTrack();
    S.eventW = Math.max(S.eventW, 3);
    S.eventsWon++;
    S.eventOver = true;
    S.opponent = null;
    S.cash += tr.purse;
    simulateFieldPoints(true, 3);
    log(S, "Won " + tr.name + " for " + money(tr.purse) + ".");
    showEvent(ART.trophy, story("eventWin", { track: tr.name, purse: money(tr.purse), team: S.team }), [
      { label: "Back to the pits", fn: showPits }
    ]);
  }

  function simulateFieldPoints(playerWon, playerRoundsWon) {
    // one event winner among rivals if player didn't win
    const riv = S.rivals.slice().sort(() => Math.random() - 0.5);
    if (!playerWon && riv[0]) {
      riv[0].points += 80;
      riv[0].eventsWon++;
      riv[0].wins += 3;
    }
    riv.forEach((r, i) => {
      if (playerWon && i === 0) { r.points += 70; r.wins += 2; r.losses += 1; return; }
      if (!playerWon && i === 0) return;
      const bump = 8 + rand(36);
      r.points += bump;
      if (chance(0.5)) r.wins += rand(3);
      r.losses += rand(3);
    });
  }

  function finishSeason() {
    if (S.over) return;
    const lead = pointsLeader();
    if (lead.isPlayer) {
      const second = S.rivals.reduce((m, r) => Math.max(m, r.points), 0);
      const kind = (S.points - second <= 30) ? "close" : (S.eventsWon >= 4 ? "swept" : "champ");
      endGame(S, true, kind);
    } else if (S.trackIndex >= TRACKS.length - 1) {
      endGame(S, false, "points");
    } else {
      endGame(S, false, "mid");
    }
  }

  function showEnd() {
    clearUI(); showHud(false);
    el.log.hidden = false;
    el.log.textContent = (S.log || []).slice(0, 8).join("\n");
    setArt(S.win ? ART.trophy : (S.endKind === "car" ? ART.smoke : ART.grave));
    let t = S.win ? "YOU ARE THE CIRCUIT CHAMPION\n\n" : "THE SEASON IS OVER\n\n";
    t += (S.endMessage || "") + "\n\n";
    t += S.racer + "  |  " + S.team + "  |  " + S.car + "  |  " + CLASSES[S.cls].name + "\n";
    t += "Ended: " + fmtDate(S.date) + "\n";
    t += "Season record: " + S.seasonW + "-" + S.seasonL + "    Event wins: " + S.eventsWon + "\n";
    t += "Points: " + S.points + "    Cash: " + money(S.cash) + "    Car: " + S.carHealth + "%\n";
    if (S.bestET != null) t += "Best e.t.: " + fmtET(S.bestET) + "\n";
    t += "Crew remaining: " + livingCount(S) + "\n\n";
    t += "SCORE: " + S.score + "  (x" + CLASSES[S.cls].multiplier + " class)\n\n";
    if (S.graves.length) {
      t += "GONE FROM THE CREW\n";
      S.graves.forEach(g => { t += "  " + g.text + "\n"; });
    }
    setText(t);
    choices([
      { label: "See the Championship Top Ten", fn: showScores },
      { label: "Run the circuit again", fn: showTitle }
    ]);
  }


  window.__DragCircuit__ = {
    getState: function () { return S; },
    setState: function (g) { S = g; },
    CLASSES: CLASSES,
    TRACKS: TRACKS,
    STORE_ITEMS: STORE_ITEMS,
    ILLNESSES: ILLNESSES,
    STORIES: STORIES,
    showTitle: showTitle,
    showPits: showPits,
    showEnd: showEnd,
    purchaseAndDepart: function (buy) {
      ui.storeBuy = Object.assign({ slicks: 0, fuel: 0, parts: 0, trans: 0, chutes: 0, food: 0 }, buy || {});
      const kind = (ui.storeKind === "track" && S && S.started) ? "track" : "start";
      const prices = pricesAt(kind);
      const spent = STORE_ITEMS.reduce((n, it) => n + (ui.storeBuy[it.key] || 0) * prices[it.key], 0);
      checkoutStore(prices, spent, kind === "start" || !(S && S.started));
    }
  };

  bindEls();
  showTitle();
})();
</script>
